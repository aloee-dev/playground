<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">  
<title>Power Training Simulator</title>
<style>

    body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;     
    overflow: hidden;
    background: white;
}

    #tab5-stats {
        display: none;
        position: relative;
        width: 100%;
        height: 100vh;
    }
    
    #stat-box {
    position: absolute;
    height: 80vh;
    width: 50%;
    overflow-y: auto;
    border: 1px solid black;
    padding: 15px;
    box-sizing: border-box;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}


    .tab-btn {
        display: inline-block;
        font-size: 16px;
        border: 3px solid black;
        background-color: #3b3b3b;
        color: white;
        padding: 10px;
    }
    .tab-btn.selected {
        background-color: white;
        color: black;
        border: 3px solid #00876a;
    }
    .tab-btn.locked {
        color: #3b3b3b;
    }
        

#box {
    position: absolute;
    width: 50px;
    height: 50px;
    background-color: #FF0000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

#shop {
    position: absolute;
    width: 25%;
    height: 100%;
    top: 30px;
    background-color: #808080;
    left: 75%;
}

#count {
    position: absolute;
    top: 50px;
    left: 10px;
    color: black;
    font-size: 16px;
}
    .bump {
    animation: bumpy 0.2s linear;
}

@keyframes bumpy {
    0% {
        width: 50px;
        height: 50px;
    }
    50% { 
        width: 75px;
        height: 75px
    }
    100% {
        width: 50px;
        height: 50px;
         }
}

</style>
</head>
<body>

    <div id="tab-list">
<div id="tab1" class="tab-btn selected">Training</div>
<div id="tab2" class="tab-btn locked">Schooling</div>
<div id="tab3" class="tab-btn locked">Mutagen Station</div>
<div id="tab4" class="tab-btn">Achievements</div>
<div id="tab5" class="tab-btn">Stats</div>
    </div>

    <div id="tab5-stats">
        <div id="stat-box">
            <div id="stat-clicks">Total Clicks: 0</div>
            <div id="stat-upgrades">Upgrades Bought: 0</div>
            <div id="stat-prestiges">Prestiges: 0</div>
            <div id="stat-cmultiplier">Permanent Click Multiplier: 0</div>
            <div id="stat-imultiplier">Permanent Idle Multiplier: 0</div>
        </div>
    </div>
            

        
<div id="tab1-training">
<div id="box"></div>
<div id="count">0</div>
<div id="shop"></div>
</div>

<script>

let money = 0;
let current = 0;
let multiplier = 1; // global
let clicks = 0;
let clickM = 1; // perm
let tempCM = 1;
let idleM = 1; // perm
let upgrades = 1;
    let statupgrades = 0;
let add = 0;
let buyCount = 1;
let strength = 0;
let endurance = 0;
let mental = 0;
let speed = 0;
let mutation = 0;
let prestiges = 0;
let intervalSpeed = 1;

let inventory = new Map();
let shownDialogue = new Set();

let DVDId = null;
let DVDInterval = 60000;

let currentTab = 1;

    // challenges i asked my brother to give:
    // if you don't press the button the last 60 seconds the button starts moving like the DVD thing
    // make the idle stuff actually give stuff. tbh useless challenge. "code your game" okay DONE
    // every minute you get tokens for multipliers

    // ideas: add chests, add lore

    const sUpgrades = [
        { id: "a", name: "Improved Studies", descript: "Increases power gained per click by 1", cost: 10, baseCost: 10, bought: 0, type: "multi" },
        { id: "b", name: "Passive Learning", descript: "Generates 1 power every 3 seconds", cost: 50, baseCost: 50, condition: "money50", bought: 0, interval: 3000, passive: 1, timerId: null, type: "multi" },
        { id: "c", name: "Better Books", descript: "Generates 3 power every 5 seconds", cost: 250, baseCost: 250, condition: "money200", bought: 0, interval: 5000, passive: 3, timerId: null, type: "multi" },
        { id: "d", name: "Crafts", descript: "Doubles power per click ", cost: 500, baseCost: 500, condition: "money200", bought: 0, type: "single" },
        { id: "e", name: "The Academy", descript: "Unlocks schooling", cost: 5000, baseCost: 5000, condition: "money50", bought: 0, type: "single" }
        ];

    let conditions = {
        money50: false,
        money200: false
    };

        const tab1 = document.getElementById('tab1');
        const tab2 = document.getElementById('tab2');
        const tab3 = document.getElementById('tab3');
        const tab4 = document.getElementById('tab4');
        const tab5 = document.getElementById('tab5');
        const training = document.getElementById('tab1-training');
        //const schooling = document.getElementById('tab2-schooling');
        //const mutagens = document.getElementById('tab3-mutagen-station');
        //const achievements = document.getElementById('tab4-achievements');
        const stats = document.getElementById('tab5-stats');
    
    document.getElementById("tab1").onclick = () => {
        tab1.classList.add('selected');
        const box = document.getElementById('box');
          box.classList.remove('bump');
        training.style.display = "block";
        if (currentTab === 2) tab2.classList.remove('selected');
        if (currentTab === 3) tab3.classList.remove('selected');
        if (currentTab === 4) tab4.classList.remove('selected');
        if (currentTab === 5) {
            tab5.classList.remove('selected');
            stats.style.display = "none";
        }
        currentTab = 1;
    }

    document.getElementById("tab5").onclick = () => {
        stats.style.display = "block";
        tab5.classList.add('selected');
        renderStats();
        if (currentTab === 2) tab2.classList.remove('selected');
        if (currentTab === 3) tab3.classList.remove('selected');
        if (currentTab === 4) tab4.classList.remove('selected');
        if (currentTab === 1) {
            tab1.classList.remove('selected');
            training.style.display = "none";
        }
        currentTab = 5;
    }
        
 
document.getElementById("box").onclick = () => {
    const box = document.getElementById('box');
  box.classList.remove('bump');
    void box.offsetWidth;
    box.classList.add('bump');
const gained = Math.round((add+upgrades) * multiplier * clickM * tempCM);
current = money + gained;
money = current;
    clicks++;
checkConditions();
document.getElementById('count').textContent = `${money}`;
};

    function renderStats() {
        document.getElementById('stat-clicks').textContent = `Total Clicks: ${clicks}`;
        document.getElementById('stat-upgrades').textContent = `Upgrades Bought: ${statupgrades}`;
        document.getElementById('stat-prestiges').textContent = `Prestiges: ${prestiges}`;
        document.getElementById('stat-cmultiplier').textContent = `Permanent Click Multiplier: ${clickM}`;
        document.getElementById('stat-imultiplier').textContent = `Permanent Idle Multiplier: ${idleM}`;
    }

    function renderUpgrades() {
        const shopContainer = document.getElementById("shop");
        shopContainer.innerHTML = "";
        sUpgrades.forEach(u => {

        if (u.condition && !conditions[u.condition]) {
            return;
        }
            if (u.type === "single" && u.bought >= 1) {
            return; 
        }
            let displayCost = u.cost;
            if (u.type !== "single") {
                displayCost = u.cost * buyCount;
            }
                
            const upgradeContainer = document.createElement("div");
            upgradeContainer.innerHTML = `
            <h3>${u.name} (${u.bought})</h3>
            <p>${u.descript}</p>
            <button id="buy-${u.id}">(${displayCost})</button>
        `;
        shopContainer.appendChild(upgradeContainer);
            document.getElementById(`buy-${u.id}`).onclick = () => {
            buyUpgrade(u);
        };
        });
    }

    function buyUpgrade(upgrade) {

        if (upgrade.type === "single") {
            if (money >= (upgrade.cost)) {
                money -= (upgrade.cost);
                upgrade.bought++;
                statupgrades++;
                if (upgrade.id === "d") {
                    tempCM++;
                }
                }
            }
            if (upgrade.type === "multi") {
        const finalCost = upgrade.cost * buyCount;
        if (money >= (finalCost)) {
            money -= (finalCost);
            if (upgrade.id === "a") {
                upgrades += buyCount;
                upgrade.cost = upgrade.cost + (10 * buyCount);
            }
            upgrade.bought = upgrade.bought + buyCount;
            statupgrades = statupgrades + buyCount;
        }
            }
            document.getElementById('count').textContent = `${money}`;
            passiveIncome();
            renderUpgrades();
    }

    window.addEventListener("keydown", (e) => {
    if (e.key === "Shift") {
        if (e.repeat) return;
        buyCount = 10;
        renderUpgrades();
    }
});

    window.addEventListener("keyup", (e) => {
        if (e.key === "Shift") {
buyCount = 1;
            renderUpgrades();
        }
});

    function calcMutagen (money) {
        if (money < 10000000000) return 0;
        const points = Math.log10(money) - 8;
        return points;
    }

    function prestige() {
        sUpgrades.forEach(u => {
            if (u.timerId) {
                clearTimeout(u.timerId);
                u.timerId = null;
            }
        u.cost = u.baseCost;
            u.bought = 0;
    });
        // all flags to false
        money = 0;
        current = 0;
        upgrades = 1;
        tempCM = 1;
        prestiges++;
        renderUpgrades();
    }

    function checkConditions() {
        if (money >= 50) {
        conditions.money50 = true;
    }
        if (money >= 200) {
        conditions.money200 = true;
    }
        renderUpgrades();
    }

    function passiveIncome () {
        sUpgrades.forEach(u => {
            if (u.bought >= 1) {
                if (u.timerId !== null) return;
        const loop = () =>
            u.timerId = setTimeout(() => {
            const idlegained = Math.round((u.passive) * multiplier * idleM * u.bought);
                money += idlegained;
                loop();
                checkConditions();
                document.getElementById('count').textContent = `${money}`;
        }, u.interval / intervalSpeed );
            loop();
            }
    });
    }

    function openChest (chest) {
        let roll = Math.floor(Math.random() * 100);
        if (chest === "wooden") {
            woodChest(roll);
        }
    }

    function giveItem (item, amount) {
        const currentCount = inventory.get(item) || 0;
        inventory.set(item, currentCount + amount);
    }

    function woodChest (roll) {
    }


    renderUpgrades();
    passiveIncome();

</script>

</body>
</html>
