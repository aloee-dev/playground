<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">  
<title>Testin</title>
<style>

    body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;     
    overflow: hidden;
    background: white;
}

#box {
    position: absolute;
    width: 50px;
    height: 50px;
    background-color: #FF0000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

#shop {
    position: absolute;
    width: 20%;
    height: 100%;
    background-color: #808080;
    left: 80%;
}

#count {
    position: absolute;
    top: 10px;
    left: 10px;
    color: black;
    font-size: 16px;
}

</style>
</head>
<body>

<div id="box"></div>
<div id="count">0</div>
<div id="shop"></div>

<script>

let money = 0;
let current = 0;
let multiplier = 1;
let upgrades = 1;
let add = 0;

document.getElementById("box").onclick = () => {
const gained = Math.round((add+upgrades) * multiplier);
current = money + gained;
money = current;

const moneyC = document.getElementById('count');
moneyC.textContent = `${money}`;
};

</script>

</body>
</html>
