<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">  
<title>Testin</title>
<style>

    body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;     
    overflow: hidden;
    background: white;
}

    .tab-btn {
        display: flex;
        font-size: 10px;
        border: 1px solid black;
        padding: 10px;
    }

#box {
    position: absolute;
    width: 50px;
    height: 50px;
    background-color: #FF0000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

#shop {
    position: absolute;
    width: 25%;
    height: 100%;
    background-color: #808080;
    left: 75%;
}

#count {
    position: absolute;
    top: 50px;
    left: 10px;
    color: black;
    font-size: 16px;
}
    .bump {
    animation: bumpy 0.2s linear;
}

@keyframes bumpy {
    0% {
        width: 50px;
        height: 50px;
    }
    50% { 
        width: 75px;
        height: 75px
    }
    100% {
        width: 50px;
        height: 50px;
         }
}

</style>
</head>
<body>

    <div id="tab-list">
<div id="tab1" class="tab-btn"></div>
<div id="tab2" class="tab-btn"></div>
<div id="tab3" class="tab-btn"></div>
    </div>

        
<div id="tab1-training">
<div id="box"></div>
<div id="count">0</div>
<div id="shop"></div>
</div>

<script>

let money = 0;
let current = 0;
let multiplier = 1;
let upgrades = 1;
let add = 0;
let buyCount = 1;
let strength = 0;
let endurance = 0;
let mental = 0;
let speed = 0;
let mutation = 0;

    // figure out how to render how many times you buy it without doing a bunch of let upgradebought = 0

    const sUpgrades = [
        { id: "a", name: "Improved Studies", descript: "Increases power gained per click by 1", cost: 10, baseCost: 10, bought: 0 },
        { id: "b", name: "Passive Learning", descript: "Generates 1 power every x seconds", cost: 50, baseCost: 50, condition: "money50", bought: 0 }
        ];

    let conditions = {
        money50: false
    };

document.getElementById("box").onclick = () => {
    const box = document.getElementById('box');
  box.classList.remove('bump');
    void box.offsetWidth;
    box.classList.add('bump');
const gained = Math.round((add+upgrades) * multiplier);
current = money + gained;
money = current;
    if (money >= 50) {
        conditions.money50 = true;
        renderUpgrades();
    }

document.getElementById('count').textContent = `${money}`;
};

    function renderUpgrades() {
        const shopContainer = document.getElementById("shop");
        shopContainer.innerHTML = "";
        sUpgrades.forEach(u => {

        if (u.condition && !conditions[u.condition]) {
            return;
        }
            const upgradeContainer = document.createElement("div");
            upgradeContainer.innerHTML = `
            <h3>${u.name} (${u.bought})</h3>
            <p>${u.descript}</p>
            <button id="buy-${u.id}">(${u.cost * buyCount})</button>
        `;
        shopContainer.appendChild(upgradeContainer);
            document.getElementById(`buy-${u.id}`).onclick = () => {
            buyUpgrade(u);
        };
        });
    }

    function buyUpgrade(upgrade) {
        const finalCost = upgrade.cost * buyCount;
        if (money >= (finalCost)) {
            money -= (finalCost);
            if (upgrade.id === "a") {
                upgrades += buyCount;
                upgrade.cost = upgrade.cost + (10 * buyCount);
            }
            document.getElementById('count').textContent = `${money}`;
            upgrade.bought = upgrade.bought + buyCount;
            renderUpgrades();
        }
    }

    window.addEventListener("keydown", (e) => {
    if (e.key === "Shift") {
        if (e.repeat) return;
        buyCount = 10;
        renderUpgrades();
    }
});

    window.addEventListener("keyup", (e) => {
        if (e.key === "Shift") {
buyCount = 1;
            renderUpgrades();
        }
});

    function prestige() {
        sUpgrades.forEach(u => {
        u.cost = u.baseCost;
            u.bought = 0;
    });
        // all flags to false
        money = 0;
        current = 0;
        upgrades = 1;
        renderUpgrades();
    }

    renderUpgrades();

</script>

</body>
</html>
