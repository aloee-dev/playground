<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">  
<title>Power Training Simulator</title>
<style>

    body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;     
    overflow: hidden;
    background: white;
}

    .tab-btn {
        display: inline-block;
        font-size: 16px;
        border: 3px solid black;
        background-color: #3b3b3b;
        color: white;
        padding: 10px;
    }
    .tab-btn.selected {
        background-color: white;
        color: black;
        border: 3px solid #00876a;
    }
    .tab-btn.locked {
        color: #3b3b3b;
    }
        

#box {
    position: absolute;
    width: 50px;
    height: 50px;
    background-color: #FF0000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

#shop {
    position: absolute;
    width: 25%;
    height: 100%;
    background-color: #808080;
    left: 75%;
}

#count {
    position: absolute;
    top: 50px;
    left: 10px;
    color: black;
    font-size: 16px;
}
    .bump {
    animation: bumpy 0.2s linear;
}

@keyframes bumpy {
    0% {
        width: 50px;
        height: 50px;
    }
    50% { 
        width: 75px;
        height: 75px
    }
    100% {
        width: 50px;
        height: 50px;
         }
}

</style>
</head>
<body>

    <div id="tab-list">
<div id="tab1" class="tab-btn selected">Training</div>
<div id="tab2" class="tab-btn locked">Schooling</div>
<div id="tab3" class="tab-btn locked">Mutagen Station</div>
<div id="tab4" class="tab-btn">Achievements</div>
<div id="tab5" class="tab-btn">Stats</div>
    </div>

        
<div id="tab1-training">
<div id="box"></div>
<div id="count">0</div>
<div id="shop"></div>
</div>

<script>

let money = 0;
let current = 0;
let multiplier = 1; // global
let clickM = 1; // just multiplier for clicks
let idleM = 1;
let upgrades = 1;
let add = 0;
let buyCount = 1;
let strength = 0;
let endurance = 0;
let mental = 0;
let speed = 0;
let mutation = 0;
let prestiges = 0;
let intervalSpeed = 1;

let inventory = new Map();
let shownDialogue = new Set();

let DVDId = null;
let DVDInterval = 60000;

    // challenges i asked my brother to give:
    // if you don't press the button the last 60 seconds the button starts moving like the DVD thing
    // make the idle stuff actually give stuff. tbh useless challenge. "code your game" okay DONE

    // ideas: add chests, add lore

    const sUpgrades = [
        { id: "a", name: "Improved Studies", descript: "Increases power gained per click by 1", cost: 10, baseCost: 10, bought: 0, type: "multi" },
        { id: "b", name: "Passive Learning", descript: "Generates 1 power every 3 seconds", cost: 50, baseCost: 50, condition: "money50", bought: 0, interval: 3000, passive: 1, timerId: null, type: "multi" },
        { id: "c", name: "Better Books", descript: "Generates 3 power every 5 seconds", cost: 250, baseCost: 250, condition: "money200", bought: 0, interval: 5000, passive: 3, timerId: null, type: "multi" },
        { id: "d", name: "The Academy", descript: "Unlocks schooling", cost: 5000, baseCost: 5000, condition: "money50", bought: 0, type: "single" }
        ];

    let conditions = {
        money50: false,
        money200: false
    };

document.getElementById("box").onclick = () => {
    const box = document.getElementById('box');
  box.classList.remove('bump');
    void box.offsetWidth;
    box.classList.add('bump');
const gained = Math.round((add+upgrades) * multiplier * clickM);
current = money + gained;
money = current;
checkConditions();
document.getElementById('count').textContent = `${money}`;
};

    function renderUpgrades() {
        const shopContainer = document.getElementById("shop");
        shopContainer.innerHTML = "";
        sUpgrades.forEach(u => {

        if (u.condition && !conditions[u.condition]) {
            return;
        }
            if (u.type === "single" && u.bought >= 1) {
            return; 
        }
            let displayCost = u.cost;
            if (u.type !== "single") {
                displayCost = u.cost * buyCount;
            }
                
            const upgradeContainer = document.createElement("div");
            upgradeContainer.innerHTML = `
            <h3>${u.name} (${u.bought})</h3>
            <p>${u.descript}</p>
            <button id="buy-${u.id}">(${displayCost})</button>
        `;
        shopContainer.appendChild(upgradeContainer);
            document.getElementById(`buy-${u.id}`).onclick = () => {
            buyUpgrade(u);
        };
        });
    }

    function buyUpgrade(upgrade) {

        if (upgrade.type === "single") {
            if (money >= (upgrade.cost)) {
                money -= (upgrade.cost);
                upgrade.bought++;
                }
            }
            if (upgrade.type === "multi") {
        const finalCost = upgrade.cost * buyCount;
        if (money >= (finalCost)) {
            money -= (finalCost);
            if (upgrade.id === "a") {
                upgrades += buyCount;
                upgrade.cost = upgrade.cost + (10 * buyCount);
            }
            upgrade.bought = upgrade.bought + buyCount;
        }
            }
            document.getElementById('count').textContent = `${money}`;
            passiveIncome();
            renderUpgrades();
    }

    window.addEventListener("keydown", (e) => {
    if (e.key === "Shift") {
        if (e.repeat) return;
        buyCount = 10;
        renderUpgrades();
    }
});

    window.addEventListener("keyup", (e) => {
        if (e.key === "Shift") {
buyCount = 1;
            renderUpgrades();
        }
});

    function prestige() {
        sUpgrades.forEach(u => {
            if (u.timerId) {
                clearTimeout(u.timerId);
                u.timerId = null;
            }
        u.cost = u.baseCost;
            u.bought = 0;
    });
        // all flags to false
        money = 0;
        current = 0;
        upgrades = 1;
        prestiges++;
        renderUpgrades();
    }

    function checkConditions() {
        if (money >= 50) {
        conditions.money50 = true;
    }
        if (money >= 200) {
        conditions.money200 = true;
    }
        renderUpgrades();
    }

    function passiveIncome () {
        sUpgrades.forEach(u => {
            if (u.bought >= 1) {
                if (u.timerId !== null) return;
        const loop = () =>
            u.timerId = setTimeout(() => {
            const idlegained = Math.round((u.passive) * multiplier * idleM * u.bought);
                money += idlegained;
                loop();
                checkConditions();
                document.getElementById('count').textContent = `${money}`;
        }, u.interval / intervalSpeed );
            loop();
            }
    });
    }

    function openChest (chest) {
        let roll = Math.floor(Math.random() * 100);
        if (chest === "wooden") {
            woodChest(roll);
        }
    }

    function giveItem (item, amount) {
        const currentCount = inventory.get(item) || 0;
        inventory.set(item, currentCount + amount);
    }

    function woodChest (roll) {
    }

    renderUpgrades();
    passiveIncome();

</script>

</body>
</html>
