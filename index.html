<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">  
<title>Testin</title>
<style>

    body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;     
    overflow: hidden;
    background: white;
}

#box {
    position: absolute;
    width: 50px;
    height: 50px;
    background-color: #FF0000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

#shop {
    position: absolute;
    width: 25%;
    height: 100%;
    background-color: #808080;
    left: 75%;
}

#count {
    position: absolute;
    top: 10px;
    left: 10px;
    color: black;
    font-size: 16px;
}

</style>
</head>
<body>

<div id="box"></div>
<div id="count">0</div>
<div id="shop"></div>

<script>

let money = 0;
let current = 0;
let multiplier = 1;
let upgrades = 1;
let add = 0;
let buyCount = 1;

    const sUpgrades = [
        { id: "a", name: "Better Clicks", descript: "Increases points gained per click by 1", cost: 10, baseCost: 10 }
        ];

    let conditions = {
        number1: false
    };

document.getElementById("box").onclick = () => {
const gained = Math.round((add+upgrades) * multiplier);
current = money + gained;
money = current;

document.getElementById('count').textContent = `${money}`;
};

    function renderUpgrades() {
        const shopContainer = document.getElementById("shop");
        shopContainer.innerHTML = "";
        sUpgrades.forEach(u => {

        if (u.condition && !conditions[u.condition]) {
            return;
        }
            const upgradeContainer = document.createElement("div");
            upgradeContainer.innerHTML = `
            <h3>${u.name}</h3>
            <p>${u.descript}</p>
            <button id="buy-${u.id}">(${u.cost * buyCount})</button>
        `;
        shopContainer.appendChild(upgradeContainer);
            document.getElementById(`buy-${u.id}`).onclick = () => {
            buyUpgrade(u);
        };
        });
    }

    function buyUpgrade(upgrade) {
        const finalCost = upgrade.cost * buyCount;
        if (money >= (finalCost)) {
            money -= (finalCost);
            if (upgrade.id === "a") {
                upgrades += buyCount;
                upgrade.cost = upgrade.cost + (10 * buyCount);
            }
            document.getElementById('count').textContent = `${money}`;
            renderUpgrades();
        }
    }

    window.addEventListener("keydown", (e) => {
    if (e.key === "Shift") {
        buyCount = 10;
        renderUpgrades();
    }
});

    window.addEventListener("keyup", (e) => {
        if (e.key === "Shift") {
buyCount = 1;
            renderUpgrades();
        }
});

    renderUpgrades();

</script>

</body>
</html>
